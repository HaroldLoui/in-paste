[package]
name = "in-paste"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "clipboard"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
